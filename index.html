<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinical Trial Pathway</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Clinical Trial Pathway</h1>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="moduleType">Pathway For</label>
                <select id="moduleType">
                    <option value="">Select...</option>
                    <option value="Patient">Patient</option>
                    <option value="Kit">Kit</option>
                </select>
            </div>

            <div class="control-group">
                <label for="moduleKey" id="moduleKeyLabel">Number</label>
                <!-- Type part of a number and pick it from the list -->
                <input id="moduleKey" type="search" list="moduleKeyList" placeholder="Choose patient or kit first"
                       autocomplete="off" disabled>
                <datalist id="moduleKeyList"></datalist>
            </div>

            <div class="control-group timeline-summary" id="timelineSummary" hidden>
                <label>Timeline Info</label>
                <div class="summary-text">
                    <a href="#" id="backLink" class="back-link" hidden>&larr; Back</a>
                    <span id="summaryText"></span>
                    <span id="statusChip" class="status-chip"></span>
                </div>
            </div>

            <div class="control-group">
                <div class="action-buttons">
                    <!-- One button: pause while playing, play while paused, replay when finished -->
                    <button id="playBtn" class="icon-button" type="button" title="Play" aria-label="Play" disabled>&#9654;&#xFE0E;</button>
                    <button id="exportBtn" class="icon-button" type="button" title="Export CSV" aria-label="Export CSV" disabled>CSV</button>
                </div>
            </div>

            <!-- Settings icon in corner -->
            <button id="settingsBtn" class="settings-icon" type="button" title="Settings" aria-label="Settings">
                <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                    <path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.4" fill="none"/>
                    <circle cx="5" cy="4" r="1.8" fill="white" stroke="currentColor" stroke-width="1.4"/>
                    <circle cx="11" cy="8" r="1.8" fill="white" stroke="currentColor" stroke-width="1.4"/>
                    <circle cx="7" cy="12" r="1.8" fill="white" stroke="currentColor" stroke-width="1.4"/>
                </svg>
            </button>

            <!-- Hidden settings panel -->
            <div class="advanced-controls-panel" id="settingsPanel" hidden>
                <div class="control-group">
                    <label for="eventsPerRow">Events Per Row</label>
                    <select id="eventsPerRow">
                        <option value="5">5 Events</option>
                        <option value="7" selected>7 Events</option>
                        <option value="10">10 Events</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="speedControl">Animation Speed</label>
                    <div class="speed-row">
                        <input type="range" id="speedControl" min="0.5" max="3" step="0.5" value="1">
                        <span id="speedValue">1x</span>
                    </div>
                </div>

                <div class="control-group">
                    <label for="themeSelector">Color Theme</label>
                    <select id="themeSelector">
                        <option value="primary">Primary Blue</option>
                        <option value="accent">Accent Blue</option>
                        <option value="green">Green</option>
                        <option value="teal">Teal</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="timeline-container">
            <div id="timelineContent">
                <div class="message">Select a patient or kit to view its pathway</div>
            </div>
        </div>
    </div>

    <script src="lib/d3.v7.min.js"></script>
    <script src="js/pathwayChart.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
